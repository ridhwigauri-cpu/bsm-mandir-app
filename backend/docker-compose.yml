services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bsm_mandir
      POSTGRES_USER: bsm
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]

  api:
    build: .
    depends_on: [db]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://bsm:password@db:5432/bsm_mandir
      JWT_SECRET: change-me
      ADMIN_PIN: "1088"
    ports: ["8080:8080"]
    command: sh -c "node src/scripts/migrate.js && node src/scripts/seed.js && node src/server.js"

volumes:
  dbdata:
